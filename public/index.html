<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Moon Courier</title>
<link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="logo">🌙</span><span>Moon Courier</span></div>
  <div class="stats">
    <div class="stat"><span>День</span><b id="st-day">1/7</b></div>
    <div class="stat"><span>Время</span><b id="st-clock">00:00</b></div>
    <div class="stat"><span>База</span><b id="st-credits">120 $</b></div>
    <div class="stat"><span>Рейтинг</span><div class="rbar"><div id="st-rating"></div></div></div>
  </div>
  <div class="spacer"></div>
  <button id="btn-play" class="icon" title="Пауза / ускорение"></button>
  <button id="btn-help" class="icon" title="Правила"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
  <button id="btn-reset" class="ghost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Новая игра</button>
</header>

<main id="layout">
  <aside class="side">
    <div class="pane-head">Заказы <span id="orders-count" class="pill"></span></div>
    <div id="orders-list" class="scroll"></div>
    <div class="pane-foot">Клик по заказу — выбор. Срочность на полосе.</div>
  </aside>

  <section id="map-wrap">
    <canvas id="map"></canvas>
    <div id="vignette"></div>
    <div class="legend">
      <span><i class="sw" style="background:#34d399"></i>низкий риск</span>
      <span><i class="sw" style="background:#fbbf24"></i>средний</span>
      <span><i class="sw" style="background:#f87171"></i>высокий</span>
    </div>
  </section>

  <aside class="side">
    <div class="pane-head">Роверы
      <span class="pane-btns">
        <button class="icon sm" id="btn-shop" title="Верфь: новые роверы"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></button>
        <button class="icon sm" id="btn-fleet" title="Флот: улучшения"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></button>
      </span>
    </div>
    <div id="rovers-list" class="scroll"></div>
    <div id="mission-box"></div>
  </aside>
</main>

<footer id="log-bar">
  <div id="log"></div>
</footer>

<div id="tut" class="hidden">
  <div class="tut-dots"></div>
  <div class="tut-t"></div>
  <div class="tut-x"></div>
  <div class="tut-hint"></div>
  <div class="tut-acts">
    <button id="tut-skip">Пропустить</button>
    <button id="tut-next">Дальше →</button>
  </div>
</div>

<div id="overlay" class="hidden"><div id="modal" class="modal"></div></div>

<div id="menu" class="hidden">
  <div class="menu-card">
    <div class="menu-logo">🌙<span>Moon Courier</span></div>
    <div class="menu-sub">Симулятор лунной доставки</div>
    <div id="menu-screen">
      <button class="menu-btn" id="menu-play"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 4l14 8-14 8z"/></svg>Играть</button>
      <button class="menu-btn" id="menu-settings">Настройки</button>
      <button class="menu-btn" id="menu-scores">Таблица лидеров</button>
    </div>
    <div id="menu-settings-screen" class="hidden">
      <div class="menu-title">Настройки</div>
      <label class="menu-lab">Имя пилота (для таблицы лидеров)
        <input id="menu-name" type="text" maxlength="16" placeholder="Диспетчер"/>
      </label>
      <div class="menu-row">
        <button class="menu-btn sm" id="menu-settings-ok">Сохранить</button>
        <button class="menu-btn sm ghost" id="menu-settings-back">← Назад</button>
      </div>
    </div>
    <div id="menu-scores-screen" class="hidden">
      <div class="menu-title">Таблица лидеров</div>
      <div id="menu-scores-list"></div>
      <div class="menu-row"><button class="menu-btn sm ghost" id="menu-scores-back">← Назад</button></div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script src="/static/tutorial.js"></script>
</body>
</html>
